name: Publicar Documentación con Sphinx 
 
on: 
  push: 
    branches: [ "main" ] 
 
permissions: 
  contents: read 
  pages: write 
  id-token: write 
 
concurrency: 
  group: "pages" 
  cancel-in-progress: false 
 
jobs: 
  build: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout del repositorio 
        uses: actions/checkout@v4 
 
      - name: Configurar entorno de Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: '3.10' 
          cache: 'pip' 
 
      - name: Instalar dependencias (Sphinx y temas) 
        run: | 
          python -m pip install --upgrade pip 
          pip install sphinx furo sphinx_rtd_theme 
 
      - name: Compilar documentación HTML 
        run: | 
          sphinx-build -b html . _build/html 
 
      - name: Subir artefacto para GitHub Pages 
        uses: actions/upload-pages-artifact@v3 
        with: 
          path: '_build/html' 
 
  deploy: 
    environment: 
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }} 
    runs-on: ubuntu-latest 
    needs: build 
    steps: 
      - name: Desplegar en GitHub Pages 
        id: deployment 
        uses: actions/deploy-pages@v4 
